# Nightly encrypted database backup — see BACKUP.md.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL       only the connection string (one line, postgresql://…) — the same database as Vercel
#   BACKUP_PASSPHRASE  a long passphrase you keep safe; without it the backups can't be opened
# The repository is public, so each backup is encrypted before it is uploaded, and nothing here ever
# prints a secret's value.
name: Nightly database backup

on:
  schedule:
    - cron: '30 20 * * *' # 20:30 UTC = 02:00 IST; GitHub may start scheduled runs a little late
  workflow_dispatch: # "Run workflow" button, for a backup on demand

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci --omit=dev

      - name: Check the secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then echo "::error::The DATABASE_URL repository secret is missing or empty (see BACKUP.md)."; missing=1; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::The BACKUP_PASSPHRASE repository secret is missing or empty (see BACKUP.md)."; missing=1; fi
          exit $missing

      - name: Back up (encrypted)
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          file="../backup/daily-scrum-$(date -u +%F).dsmb"
          node scripts/backup.js "$file"
          node scripts/restore.js "$file" --check

      - uses: actions/upload-artifact@v7
        with:
          name: daily-scrum-backup-${{ github.run_number }}
          path: backup/*.dsmb
          retention-days: 30
          if-no-files-found: error
